<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Belanja Harian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kalendar bulan (Isnin dahulu) di kiri, panel nota hari terpilih di kanan; bertindan di telefon */
:root {
  --bg: #eef3f0;
  --surface: #ffffff;
  --ink: #12302a;
  --muted: #5b726b;
  --line: #d3dfda;
  --accent: #d99a1e;        /* kunyit */
  --accent-ink: #2a1c00;
  --brand: #1d5c4f;         /* hijau daun pandan tua */
  --brand-soft: #dcebe5;
  --danger: #b4412f;
  --today: #fff4d9;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a17; --surface: #15241f; --ink: #e4efea; --muted: #93aaa2; --line: #2a3d37;
    --accent: #f0b440; --accent-ink: #231700; --brand: #7fcab6; --brand-soft: #1d3a32;
    --danger: #ef8b78; --today: #33290f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a17; --surface: #15241f; --ink: #e4efea; --muted: #93aaa2; --line: #2a3d37;
  --accent: #f0b440; --accent-ink: #231700; --brand: #7fcab6; --brand-soft: #1d3a32;
  --danger: #ef8b78; --today: #33290f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
header h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
header h1 span { color: var(--brand); }
.brand { flex: 1 1 300px; min-width: 0; }
.brand-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); flex-shrink: 0; }
.lang button { border: none; background: none; border-radius: 999px; padding: 4px 11px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--brand); color: var(--surface); }
.month-total { text-align: right; }
@media (max-width: 480px) { .month-total { text-align: left; width: 100%; } }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.month-total .num { font-size: 1.6rem; font-weight: 700; }
.mt-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 14px; }
@media (max-width: 480px) { .mt-row { justify-content: space-between; } }
.rec-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--brand); background: var(--surface); color: var(--brand); border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 0.84rem; white-space: nowrap; }
@media (max-width: 400px) { .month-total .num { font-size: 1.35rem; } }
@media (max-width: 380px) { .rec-btn { padding: 6px 9px; font-size: 0.78rem; gap: 4px; } .rec-btn svg { width: 14px; height: 14px; } .mt-row { gap: 8px 10px; } }
.rec-btn svg { width: 16px; height: 16px; }

/* Lembaran Rekod perbelanjaan */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 680px; margin: 0 auto; display: grid; gap: 18px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
.sheet-sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
.close { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 40px; height: 40px; font-size: 1.3rem; line-height: 1; flex-shrink: 0; }
.sheet-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.sheet-nav strong { font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }
.sheet-nav .num { display: block; color: var(--brand); font-weight: 700; font-size: 0.95rem; text-align: center; }
.sheet-nav button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 38px; height: 38px; font-weight: 700; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--surface); }
.seg button { border: none; background: none; border-radius: 9px; padding: 9px 8px; font-weight: 700; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--surface); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat .num { display: block; font-weight: 700; font-size: 1.05rem; margin-top: 2px; }
.stat small { color: var(--muted); font-size: 0.8rem; }
.mrow { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) auto; align-items: center; gap: 10px; background: none; border: none; padding: 5px 0; text-align: left; width: 100%; font-size: 0.92rem; }
.mrow .nm { font-weight: 600; }
.mrow .bar { display: block; grid-column: auto; height: 8px; }
.mrow .num { font-weight: 700; min-width: 6.5em; text-align: right; }
.mrow.zero { color: var(--muted); }
.mrow.zero .num { font-weight: 500; }
.mrow.top .bar i { background: var(--brand); }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.sec h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; font-weight: 600; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 0.92rem; }
.catrow .nm { font-weight: 600; overflow-wrap: anywhere; }
.catrow .num { font-weight: 700; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.dgroup { display: grid; gap: 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
.dgroup:first-of-type { border-top: none; padding-top: 0; }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; background: none; border: none; padding: 4px 0; text-align: left; width: 100%; }
.dhead span:first-child { font-weight: 700; }
.dhead span:first-child small { color: var(--brand); font-weight: 600; font-size: 0.78rem; margin-left: 6px; text-decoration: underline; }
.dhead .num { font-weight: 700; color: var(--brand); }
.dline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font-size: 0.9rem; }
.dline span:first-child { overflow-wrap: anywhere; }
body.lock { overflow: hidden; }


.main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }

.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.cal-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.cal-head h2 { font-size: 1.2rem; font-weight: 600; white-space: nowrap; }
.nav { display: flex; gap: 6px; }
.nav button { white-space: nowrap; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-width: 36px; height: 36px; padding: 0 8px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
.dow.wkend { color: var(--danger); }
.day {
  position: relative; border: 1px solid transparent; background: var(--bg); border-radius: 9px;
  min-height: 64px; padding: 6px 5px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left;
}
.day:hover { border-color: var(--line); }
.day .d { font-weight: 700; font-size: 0.95rem; }
.day .amt { font-family: var(--f-num); font-size: 0.66rem; color: var(--brand); font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day.has { background: var(--brand-soft); }
.day.today { background: var(--today); }
.day.today .d::after { content: "•"; color: var(--accent); margin-left: 3px; }
.day.sel { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.day.blank { visibility: hidden; }
.cal-foot { display: flex; justify-content: space-between; margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
.cal-foot button { background: none; border: none; color: var(--brand); font-weight: 600; padding: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 16px; scroll-margin-top: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel-head h2 { font-size: 1.45rem; font-weight: 800; line-height: 1.1; }
.panel-head .date { color: var(--muted); font-size: 0.9rem; }
.day-total { text-align: right; flex-shrink: 0; }
.day-total .num { font-size: 1.25rem; font-weight: 700; color: var(--brand); }

.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
.list li:first-child { border-top: none; }
.item-main { min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.item-note { color: var(--muted); font-size: 0.88rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); margin-right: 6px; }
.item-side { text-align: right; display: grid; gap: 4px; justify-items: end; }
.item-side .num { font-weight: 700; }
.acts { display: flex; gap: 4px; }
.acts button { background: none; border: none; font-size: 0.78rem; color: var(--muted); padding: 2px 4px; text-decoration: underline; }
.acts button.del { color: var(--danger); }
.empty { color: var(--muted); font-size: 0.92rem; padding: 6px 0; }

form { display: grid; gap: 10px; background: var(--bg); border-radius: 12px; padding: 14px; }
form h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; font-weight: 600; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; }
@media (max-width: 380px) { .row { grid-template-columns: minmax(0, 1fr); } }
label { display: grid; gap: 4px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
textarea { resize: vertical; min-height: 64px; }
.money { position: relative; }
.money span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-family: var(--f-num); color: var(--muted); font-size: 0.85rem; pointer-events: none; }
.money input { padding-left: 38px; font-family: var(--f-num); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 0.82rem; font-weight: 600; }
.cats button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.cats .cc { display: inline-flex; }
.cats .cc button[data-cat] { border-radius: 999px 0 0 999px; border-right: none; }
.cats .cc .x { border-radius: 0 999px 999px 0; padding: 5px 10px 5px 8px; color: var(--muted); }
.cats .cc button[aria-pressed="true"] + .x { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.cats .add { border-style: dashed; border-color: var(--brand); color: var(--brand); }
.cat-new { display: flex; gap: 6px; margin-top: 8px; }
.cat-new input { flex: 1; min-width: 0; padding: 7px 10px; }
.cat-new button { border: none; border-radius: 8px; padding: 0 12px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.cat-new .ok { background: var(--brand); color: var(--surface); }
.cat-new .no { background: none; color: var(--muted); }
.form-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: none; border-radius: 10px; padding: 11px 18px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; border: 1px solid var(--line); }
.err { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; }

.confirm { display: flex; gap: 6px; align-items: center; font-size: 0.78rem; }
.confirm button { border: none; border-radius: 6px; padding: 3px 8px; font-weight: 700; font-size: 0.78rem; }
.confirm .yes { background: var(--danger); color: var(--surface); }
.confirm .no { background: var(--bg); }
@media (prefers-reduced-motion: no-preference) { .day { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-top">
        <div class="label" data-i18n="eyebrow">Rekod perbelanjaan</div>
        <div class="lang" role="group" data-i18n-aria="language" aria-label="Bahasa">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <h1 id="appTitle">Buku <span>Belanja</span> Harian</h1>
    </div>
    <div class="month-total">
      <div class="label" id="monthLabel">Jumlah bulan ini</div>
      <div class="mt-row">
        <div class="num" id="monthTotal">RM 0.00</div>
        <button type="button" class="rec-btn" id="openRec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg><span data-i18n="records">Rekod perbelanjaan</span></button>
      </div>
    </div>
  </header>

  <div class="main">
    <section class="cal" data-i18n-aria="calendar" aria-label="Kalendar">
      <div class="cal-head">
        <h2 id="calTitle">Bulan</h2>
        <div class="nav">
          <button type="button" id="prevM" data-i18n-aria="prevMonth" aria-label="Bulan sebelum">‹</button>
          <button type="button" id="todayBtn" data-i18n="today">Hari ini</button>
          <button type="button" id="nextM" data-i18n-aria="nextMonth" aria-label="Bulan seterusnya">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="cal-foot">
        <span data-i18n="calHint">Tekan mana-mana tarikh untuk tulis nota.</span>
      </div>
    </section>

    <section class="panel" id="panel" aria-live="polite">
      <div class="panel-head">
        <div>
          <h2 id="dayName">Isnin</h2>
          <div class="date" id="dayDate"></div>
        </div>
        <div class="day-total">
          <div class="label" data-i18n="dayTotal">Jumlah hari</div>
          <div class="num" id="dayTotal">RM 0.00</div>
        </div>
      </div>

      <ul class="list" id="list"></ul>

      <form id="form" novalidate>
        <h3 id="formTitle">Tambah nota perbelanjaan</h3>
        <div class="row">
          <label for="fItem"><span data-i18n="item">Perkara</span>
            <input id="fItem" type="text" maxlength="80" data-i18n-ph="itemPh" placeholder="cth. Nasi lemak + teh tarik" autocomplete="off">
          </label>
          <label for="fAmt"><span data-i18n="amount">Jumlah</span>
            <span class="money"><span>RM</span><input id="fAmt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></span>
          </label>
        </div>
        <div>
          <div class="label" style="margin-bottom:6px" data-i18n="category">Kategori</div>
          <div class="cats" id="cats"></div>
          <div class="cat-new" id="catNew" hidden>
            <input id="fCat" type="text" maxlength="30" data-i18n-ph="catPh" placeholder="Tulis kategori, cth. Sedekah" autocomplete="off" data-i18n-aria="catNew" aria-label="Kategori baharu">
            <button type="button" class="ok" id="catAdd" data-i18n="save">Simpan</button>
            <button type="button" class="no" id="catCancel" data-i18n="cancel">Batal</button>
          </div>
        </div>
        <label for="fNote"><span data-i18n="note">Nota (pilihan)</span>
          <textarea id="fNote" maxlength="500" data-i18n-ph="notePh" placeholder="cth. Sarapan dengan kawan sekerja di gerai depan pejabat"></textarea>
        </label>
        <div class="err" id="err"></div>
        <div class="form-acts">
          <button type="submit" class="btn primary" id="saveBtn">Simpan nota</button>
          <button type="button" class="btn ghost" id="cancelEdit" data-i18n="cancel" hidden>Batal</button>
        </div>
      </form>
    </section>
  </div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="recTitle" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <div>
        <h2 id="recTitle" data-i18n="records">Rekod perbelanjaan</h2>
        <div class="sheet-sub" id="recSub"></div>
      </div>
      <button type="button" class="close" id="closeRec" data-i18n-aria="close" aria-label="Tutup">×</button>
    </div>
    <div class="seg" role="group" data-i18n-aria="viewMode" aria-label="Paparan rekod">
      <button type="button" data-mode="month" aria-pressed="true" data-i18n="monthly">Bulanan</button>
      <button type="button" data-mode="year" aria-pressed="false" data-i18n="yearly">Tahunan</button>
    </div>
    <div class="sheet-nav">
      <button type="button" id="recPrev" aria-label="Bulan sebelum">‹</button>
      <div><strong id="recMonth"></strong><span class="num" id="recTotal"></span></div>
      <button type="button" id="recNext" aria-label="Bulan seterusnya">›</button>
    </div>
    <div id="recBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  // ---- Teks dua bahasa ----
  const T = {
    ms: {
      title: "Buku Belanja Harian",
      h1: 'Buku <span>Belanja</span> Harian',
      eyebrow: "Rekod perbelanjaan",
      language: "Bahasa",
      records: "Rekod perbelanjaan",
      monthTotal: (m) => "Jumlah " + m,
      calendar: "Kalendar",
      prevMonth: "Bulan sebelum",
      nextMonth: "Bulan seterusnya",
      today: "Hari ini",
      calHint: "Tekan mana-mana tarikh untuk tulis nota.",
      dayTotal: "Jumlah hari",
      addTitle: "Tambah nota perbelanjaan",
      editTitle: "Ubah nota",
      item: "Perkara",
      itemPh: "cth. Nasi lemak + teh tarik",
      amount: "Jumlah",
      category: "Kategori",
      catPh: "Tulis kategori, cth. Sedekah",
      catNew: "Kategori baharu",
      save: "Simpan",
      cancel: "Batal",
      note: "Nota (pilihan)",
      notePh: "cth. Sarapan dengan kawan sekerja di gerai depan pejabat",
      saveNote: "Simpan nota",
      saveChanges: "Simpan perubahan",
      emptyDay: (d) => "Tiada perbelanjaan lagi untuk hari " + d + ". Tulis nota pertama di bawah.",
      delQ: "Padam?", yes: "Ya", no: "Tidak", edit: "Ubah", del: "Padam",
      removeCat: (c) => "Buang kategori " + c,
      addCat: "✏️ Tambah",
      catAdded: (c) => "Kategori “" + c + "” ditambah",
      noteDeleted: "Nota dipadam",
      changesSaved: "Perubahan disimpan",

      errItem: "Write what you bought, for example “Lunch”.",
      errAmt: "Enter an amount in RM, for example 12.50.",
      close: "Close",
      recSub: (n, d) => n + (n === 1 ? " note" : " notes") + " across " + d + (d === 1 ? " day" : " days"),
      noNotes: "No notes",
      recEmpty: (m) => "No expenses recorded for " + m + " yet. Close this page and tap any date on the calendar to start.",
      byCat: "By category",
      byDate: "By date",
      open: "Open",
      monthly: "Monthly",
      yearly: "Yearly",
      viewMode: "Record view",
      byMonth: "By month",
      recSubYear: (n, m) => n + (n === 1 ? " note" : " notes") + " across " + m + (m === 1 ? " month" : " months"),
      recEmptyYear: (y) => "No expenses recorded for " + y + " yet. Close this page and tap any date on the calendar to start.",
      highest: "Highest month",
      avg: "Monthly average",
      avgNote: (m) => "over " + m + (m === 1 ? " month" : " months") + " with records",
      prevYear: "Previous year",
      nextYear: "Next year",
      days: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
      dow: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
      months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
      monthsShort: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
      // Kategori asal disimpan dengan nama Melayu; ini terjemahan paparannya
      cats: { "Makan": "Food", "Pengangkutan": "Transport", "Barang dapur": "Groceries", "Bil": "Bills", "Belanja": "Shopping", "Lain-lain": "Others" }
    }
  };
  const KATEGORI = ["Makan", "Pengangkutan", "Barang dapur", "Bil", "Belanja"];
  const KEY = "bukuBelanja.v1";
  const LANG_KEY = "bukuBelanja.lang";

  let lang = "ms";
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === "ms" || saved === "en") lang = saved;
    else if (/^en\b/i.test(navigator.language || "")) lang = "en";
  } catch (e) {}
  const t = () => T[lang];
  const catLabel = (c) => t().cats[c] || c;

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const rm = (n) => "RM " + n.toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sum = (arr) => arr.reduce((s, e) => s + (Number(e.amt) || 0), 0);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const monthName = (y, m) => t().months[m] + " " + y;

  let store = { days: {}, cats: [] };
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) store = JSON.parse(raw);
    } catch (e) {}
    if (!store || typeof store.days !== "object") store = { days: {} };
    if (!Array.isArray(store.cats)) store.cats = [];
    // Buang data contoh daripada versi awal app
    let changed = false;
    Object.keys(store.days).forEach((k) => {
      const kept = store.days[k].filter((e) => !e.sample);
      if (kept.length !== store.days[k].length) changed = true;
      if (kept.length) store.days[k] = kept; else delete store.days[k];
    });
    if ("sample" in store) { delete store.sample; changed = true; }
    if (changed) save();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = new Date(today);
  let selCat = KATEGORI[0];
  let editingId = null;
  let confirmId = null;

  function entries(k) { return store.days[k] || []; }

  function applyStatic() {
    const L = t();
    document.documentElement.lang = lang;
    document.title = L.title;
    $("appTitle").innerHTML = L.h1;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = L[el.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = L[el.dataset.i18nPh]; });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", L[el.dataset.i18nAria]); });
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("formTitle").textContent = editingId ? L.editTitle : L.addTitle;
    $("saveBtn").textContent = editingId ? L.saveChanges : L.saveNote;
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    $("err").textContent = "";
    applyStatic(); renderCats(); renderCal(); renderPanel();
    if (!$("sheet").hidden) renderRec();
  }

  function renderCal() {
    const L = t();
    const y = view.getFullYear(), m = view.getMonth();
    $("calTitle").textContent = monthName(y, m);
    $("monthLabel").textContent = L.monthTotal(monthName(y, m));
    const grid = $("grid");
    grid.innerHTML = "";
    L.dow.forEach((h, i) => {
      const el = document.createElement("div");
      el.className = "dow" + (i >= 5 ? " wkend" : "");
      el.textContent = h;
      grid.appendChild(el);
    });
    const first = new Date(y, m, 1);
    const lead = (first.getDay() + 6) % 7; // Isnin = 0
    for (let i = 0; i < lead; i++) {
      const b = document.createElement("div"); b.className = "day blank"; grid.appendChild(b);
    }
    const daysIn = new Date(y, m + 1, 0).getDate();
    let monthSum = 0;
    for (let d = 1; d <= daysIn; d++) {
      const date = new Date(y, m, d);
      const k = keyOf(date);
      const total = sum(entries(k));
      monthSum += total;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day" + (total > 0 ? " has" : "") +
        (date.getTime() === today.getTime() ? " today" : "") +
        (date.getTime() === selected.getTime() ? " sel" : "");
      btn.setAttribute("aria-label", L.days[date.getDay()] + " " + d + " " + L.months[m] + (total ? ", " + rm(total) : ""));
      btn.innerHTML = '<span class="d">' + d + '</span>' + (total ? '<span class="amt">' + Math.round(total) + '</span>' : "");
      btn.addEventListener("click", () => selectDay(date, true));
      grid.appendChild(btn);
    }
    $("monthTotal").textContent = rm(monthSum);
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function renderPanel() {
    const L = t();
    const k = keyOf(selected);
    const list = entries(k);
    $("dayName").textContent = L.days[selected.getDay()];
    $("dayDate").textContent = selected.getDate() + " " + L.months[selected.getMonth()] + " " + selected.getFullYear() +
      (selected.getTime() === today.getTime() ? " · " + L.today : "");
    $("dayTotal").textContent = rm(sum(list));
    const ul = $("list");
    if (!list.length) {
      ul.innerHTML = '<li class="empty">' + esc(L.emptyDay(L.days[selected.getDay()])) + '</li>';
      return;
    }
    ul.innerHTML = list.map((e) => {
      const acts = confirmId === e.id
        ? '<span class="confirm">' + L.delQ + ' <button type="button" class="yes" data-yes="' + e.id + '">' + L.yes + '</button><button type="button" class="no" data-no="1">' + L.no + '</button></span>'
        : '<span class="acts"><button type="button" data-edit="' + e.id + '">' + L.edit + '</button><button type="button" class="del" data-del="' + e.id + '">' + L.del + '</button></span>';
      return '<li><div class="item-main"><div class="item-title"><span class="chip">' + esc(catLabel(e.cat)) + '</span>' + esc(e.item) + '</div>' +
        (e.note ? '<div class="item-note">' + esc(e.note) + '</div>' : "") +
        '</div><div class="item-side"><span class="num">' + rm(Number(e.amt)) + '</span>' + acts + '</div></li>';
    }).join("");
  }

  function renderCats() {
    const L = t();
    const chip = (c) => '<button type="button" aria-pressed="' + (c === selCat) + '" data-cat="' + esc(c) + '">' + esc(catLabel(c)) + '</button>';
    const own = store.cats.slice();
    // Nota lama mungkin guna kategori yang tiada dalam senarai (cth. "Lain-lain")
    const extra = KATEGORI.includes(selCat) || own.includes(selCat) ? [] : [selCat];
    $("cats").innerHTML = KATEGORI.map(chip).join("") +
      own.map((c) => '<span class="cc">' + chip(c) + '<button type="button" class="x" data-delcat="' + esc(c) + '" aria-label="' + esc(L.removeCat(c)) + '">×</button></span>').join("") +
      extra.map(chip).join("") +
      '<button type="button" class="add" id="catOpen">' + L.addCat + '</button>';
  }

  function closeCatNew() { $("catNew").hidden = true; $("fCat").value = ""; }

  function addCat() {
    const name = $("fCat").value.trim().replace(/\s+/g, " ");
    if (!name) { $("fCat").focus(); return; }
    const low = name.toLowerCase();
    // Padankan dengan nama Melayu atau Inggeris kategori sedia ada
    const found = KATEGORI.concat(store.cats).find((c) => c.toLowerCase() === low || (T.en.cats[c] || "").toLowerCase() === low);
    if (found) { selCat = found; }
    else { store.cats.push(name); selCat = name; save(); toast(t().catAdded(name)); }
    closeCatNew(); renderCats();
  }

  function resetForm() {
    editingId = null;
    $("fItem").value = ""; $("fAmt").value = ""; $("fNote").value = "";
    $("err").textContent = "";
    $("formTitle").textContent = t().addTitle;
    $("saveBtn").textContent = t().saveNote;
    $("cancelEdit").hidden = true;
    selCat = KATEGORI[0]; closeCatNew(); renderCats();
  }

  function selectDay(date, scroll) {
    selected = new Date(date);
    confirmId = null;
    resetForm();
    renderCal(); renderPanel();
    if (scroll && window.matchMedia("(max-width: 820px)").matches) {
      $("panel").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  let toastTimer;
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
  }

  document.querySelector(".lang").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-lang]");
    if (b && b.dataset.lang !== lang) setLang(b.dataset.lang);
  });

  $("cats").addEventListener("click", (ev) => {
    const el = ev.target;
    if (el.id === "catOpen") { $("catNew").hidden = false; $("fCat").focus(); return; }
    if (el.dataset.delcat) {
      store.cats = store.cats.filter((c) => c !== el.dataset.delcat);
      if (selCat === el.dataset.delcat) selCat = KATEGORI[0];
      save(); renderCats(); return;
    }
    const b = el.closest("[data-cat]"); if (!b) return;
    selCat = b.dataset.cat; renderCats();
  });
  $("catAdd").addEventListener("click", addCat);
  $("catCancel").addEventListener("click", closeCatNew);
  $("fCat").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); addCat(); }
    if (ev.key === "Escape") closeCatNew();
  });

  $("list").addEventListener("click", (ev) => {
    const k = keyOf(selected);
    const el = ev.target;
    if (el.dataset.del) { confirmId = el.dataset.del; renderPanel(); return; }
    if (el.dataset.no) { confirmId = null; renderPanel(); return; }
    if (el.dataset.yes) {
      store.days[k] = entries(k).filter((e) => e.id !== el.dataset.yes);
      if (!store.days[k].length) delete store.days[k];
      confirmId = null;
      if (editingId === el.dataset.yes) resetForm();
      save(); renderCal(); renderPanel(); toast(t().noteDeleted);
      return;
    }
    if (el.dataset.edit) {
      const e = entries(k).find((x) => x.id === el.dataset.edit); if (!e) return;
      editingId = e.id;
      $("fItem").value = e.item; $("fAmt").value = e.amt; $("fNote").value = e.note || "";
      selCat = e.cat; renderCats();
      $("formTitle").textContent = t().editTitle;
      $("saveBtn").textContent = t().saveChanges;
      $("cancelEdit").hidden = false;
      $("fItem").focus();
    }
  });

  $("cancelEdit").addEventListener("click", resetForm);

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const item = $("fItem").value.trim();
    const amt = parseFloat($("fAmt").value);
    const note = $("fNote").value.trim();
    if (!item) { $("err").textContent = t().errItem; $("fItem").focus(); return; }
    if (!(amt >= 0) || !isFinite(amt)) { $("err").textContent = t().errAmt; $("fAmt").focus(); return; }
    const k = keyOf(selected);
    const list = entries(k).slice();
    const rec = { item, amt: Math.round(amt * 100) / 100, cat: selCat, note };
    if (editingId) {
      const i = list.findIndex((e) => e.id === editingId);
      if (i >= 0) list[i] = { ...list[i], ...rec };
    } else {
      list.push({ id: uid(), ...rec });
    }
    store.days[k] = list;
    const wasEdit = !!editingId;
    save(); resetForm(); renderCal(); renderPanel();
    toast(wasEdit ? t().changesSaved : t().noteSaved);
  });

  // ---- Rekod perbelanjaan (bulanan / tahunan) ----
  let recMode = "month";
  function catSection(L, byCat, total) {
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const max = cats[0][1] || 1;
    return '<section class="sec"><h3>' + L.byCat + '</h3>' + cats.map(([c, a]) =>
      '<div class="catrow"><span class="nm">' + esc(catLabel(c)) + '</span><span class="num">' + rm(a) + ' <small style="color:var(--muted);font-weight:500">' + Math.round(a / total * 100) + '%</small></span>' +
      '<div class="bar"><i style="width:' + Math.max(2, a / max * 100).toFixed(1) + '%"></i></div></div>').join("") + '</section>';
  }
  function renderRec() {
    const L = t();
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === recMode)));
    $("recPrev").setAttribute("aria-label", recMode === "year" ? L.prevYear : L.prevMonth);
    $("recNext").setAttribute("aria-label", recMode === "year" ? L.nextYear : L.nextMonth);
    if (recMode === "year") return renderYear(L);
    const y = view.getFullYear(), m = view.getMonth();
    const prefix = y + "-" + pad(m + 1) + "-";
    const keys = Object.keys(store.days).filter((k) => k.startsWith(prefix) && store.days[k].length).sort().reverse();
    let total = 0, count = 0;
    const byCat = {};
    keys.forEach((k) => store.days[k].forEach((e) => {
      const a = Number(e.amt) || 0; total += a; count++;
      byCat[e.cat] = (byCat[e.cat] || 0) + a;
    }));
    $("recMonth").textContent = monthName(y, m);
    $("recTotal").textContent = rm(total);
    $("recSub").textContent = count ? L.recSub(count, keys.length) : L.noNotes;
    if (!count) {
      $("recBody").innerHTML = '<div class="sec"><p class="empty" style="margin:0">' + esc(L.recEmpty(monthName(y, m))) + '</p></div>';
      return;
    }
    const dayHtml = keys.map((k) => {
      const [yy, mm, dd] = k.split("-").map(Number);
      const d = new Date(yy, mm - 1, dd);
      const list = store.days[k];
      return '<div class="dgroup"><button type="button" class="dhead" data-goto="' + k + '"><span>' + L.days[d.getDay()] + ', ' + dd + ' ' + L.monthsShort[mm - 1] + '<small>' + L.open + '</small></span><span class="num">' + rm(sum(list)) + '</span></button>' +
        list.map((e) => '<div class="dline"><span><span class="chip">' + esc(catLabel(e.cat)) + '</span>' + esc(e.item) + '</span><span class="num">' + rm(Number(e.amt)) + '</span></div>').join("") + '</div>';
    }).join("");
    $("recBody").innerHTML = '<div style="display:grid;gap:18px">' + catSection(L, byCat, total) +
      '<section class="sec"><h3>' + L.byDate + '</h3>' + dayHtml + '</section></div>';
  }
  function renderYear(L) {
    const y = view.getFullYear();
    const months = new Array(12).fill(0);
    const byCat = {};
    let total = 0, count = 0;
    Object.keys(store.days).forEach((k) => {
      if (!k.startsWith(y + "-")) return;
      const mi = Number(k.slice(5, 7)) - 1;
      store.days[k].forEach((e) => {
        const a = Number(e.amt) || 0; total += a; count++;
        months[mi] += a; byCat[e.cat] = (byCat[e.cat] || 0) + a;
      });
    });
    const active = months.filter((a) => a > 0).length;
    $("recMonth").textContent = String(y);
    $("recTotal").textContent = rm(total);
    $("recSub").textContent = count ? L.recSubYear(count, active) : L.noNotes;
    if (!count) {
      $("recBody").innerHTML = '<div class="sec"><p class="empty" style="margin:0">' + esc(L.recEmptyYear(y)) + '</p></div>';
      return;
    }
    const max = Math.max(...months);
    const top = months.indexOf(max);
    const stats = '<div class="stats">' +
      '<div class="stat"><div class="label">' + L.highest + '</div><span class="num">' + rm(max) + '</span><small>' + L.months[top] + '</small></div>' +
      '<div class="stat"><div class="label">' + L.avg + '</div><span class="num">' + rm(total / active) + '</span><small>' + L.avgNote(active) + '</small></div></div>';
    const monthHtml = months.map((a, i) =>
      '<button type="button" class="mrow' + (a ? "" : " zero") + (i === top ? " top" : "") + '" data-month="' + i + '">' +
      '<span class="nm">' + L.monthsShort[i] + '</span>' +
      '<span class="bar"><i style="width:' + (a ? Math.max(2, a / max * 100).toFixed(1) : 0) + '%"></i></span>' +
      '<span class="num">' + (a ? rm(a) : "\u2014") + '</span></button>').join("");
    $("recBody").innerHTML = '<div style="display:grid;gap:18px">' + stats +
      '<section class="sec"><h3>' + L.byMonth + '</h3><div>' + monthHtml + '</div></section>' +
      catSection(L, byCat, total) + '</div>';
  }
  let lastFocus = null;
  function openRec() {
    lastFocus = document.activeElement;
    renderRec();
    $("sheet").hidden = false; $("sheet").scrollTop = 0;
    document.body.classList.add("lock");
    try { history.pushState({ rec: 1 }, ""); } catch (e) {}
    $("closeRec").focus();
  }
  function hideRec() {
    $("sheet").hidden = true;
    document.body.classList.remove("lock");
    if (lastFocus) lastFocus.focus();
  }
  // Tutup melalui butang Kembali telefon juga
  function closeRec() { if (history.state && history.state.rec) history.back(); else hideRec(); }
  window.addEventListener("popstate", () => { if (!$("sheet").hidden) hideRec(); });
  $("openRec").addEventListener("click", openRec);
  $("closeRec").addEventListener("click", closeRec);
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("sheet").hidden) closeRec(); });
  function shiftRec(dir) {
    view = recMode === "year"
      ? new Date(view.getFullYear() + dir, view.getMonth(), 1)
      : new Date(view.getFullYear(), view.getMonth() + dir, 1);
    renderCal(); renderRec(); $("sheet").scrollTop = 0;
  }
  $("recPrev").addEventListener("click", () => shiftRec(-1));
  $("recNext").addEventListener("click", () => shiftRec(1));
  document.querySelector(".seg").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-mode]");
    if (!b || b.dataset.mode === recMode) return;
    recMode = b.dataset.mode; renderRec(); $("sheet").scrollTop = 0;
  });
  $("recBody").addEventListener("click", (ev) => {
    const mb = ev.target.closest("[data-month]");
    if (mb) {
      // Dari paparan tahunan: buka bulan itu dalam paparan bulanan
      view = new Date(view.getFullYear(), Number(mb.dataset.month), 1);
      recMode = "month"; renderCal(); renderRec(); $("sheet").scrollTop = 0;
      return;
    }
    const b = ev.target.closest("[data-goto]"); if (!b) return;
    const [yy, mm, dd] = b.dataset.goto.split("-").map(Number);
    closeRec();
    setTimeout(() => selectDay(new Date(yy, mm - 1, dd), true), 50);
  });

  $("prevM").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
  $("nextM").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
  $("todayBtn").addEventListener("click", () => { view = new Date(today.getFullYear(), today.getMonth(), 1); selectDay(today, false); });

  load();
  applyStatic();
  renderCats();
  renderCal();
  renderPanel();
})();
</script>
</body>
</html>
